fan_reviews_url: "https://fan.reviews/creator/adult-content-model/nash-gnomie-brattyxgnome"

pagination:
  enabled: true
  mode: "discover"
  max_pages: 20

# CSS selectors for fan.reviews. Each one lists the current layout first and
# the older layout after the comma, so a small site change doesn't break it.
selectors:
  review_container: "ol.commentlist.main-comment > li.comment.depth-1"
  username: ".comment-meta-author a, .comment-header .author-link"
  avatar: ".comment-author-img img, .comment-header .comment-author a img"
  rating_text: ".comment-rate .comment-rate__cur"
  review_content: ".comment-text p, .comment-content p"
  review_title: ".review_title"
  time_text: ".comment-meta-date, .comment-header .comment-date .time"

storage:
  # Last good scrape. Served if fan.reviews can't be reached.
  json_path: "data/reviews.json"

# How long the server reuses a scrape before fetching fan.reviews again
cache_minutes: 60

request:
  user_agent: "Mozilla/5.0 (compatible; GnomeMod-ReviewBot/1.0; +https://nashgnomie.vip)"
  timeout: 20
  sleep_between_pages_ms: 700

server:
  host: "0.0.0.0"
  port: 8989
  cors_origins:
    - "https://nashgnomie.vip"
    - "https://www.nashgnomie.vip"
    - "https://nashgnomie.com"
    - "https://www.nashgnomie.com"
